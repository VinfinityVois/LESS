name: LESS CI

on:
  pull_request:
    branches:
      - feat/control-room-redesign
      - main
  push:
    branches:
      - feat/admin-users-biometric-workflow

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate lockfile with patched dependency versions
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: less-frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q backend/app

  security-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve patched frontend dependency tree
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  security-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt
